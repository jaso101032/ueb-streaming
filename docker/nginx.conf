server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 513m;
    client_body_timeout 3600s;
    sendfile on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /hls/ {
        # Both containers mount the same HLS volume; serve each fragment once
        # from disk instead of proxying every viewer through the RTMP worker.
        alias /tmp/hls/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # PHP authorizes each request; Nginx sends the private MP4 with byte-range
    # support so a viewer does not occupy a PHP-FPM worker for the transfer.
    location ^~ /_protected_media/scheduled-videos/ {
        internal;
        alias /var/www/html/storage/app/private/scheduled-videos/;
        default_type video/mp4;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ^~ /_protected_media/institutional-ads/ {
        internal;
        alias /var/www/html/storage/app/private/institutional-ads/;
        default_type video/mp4;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ^~ /_protected_media/recordings/ {
        internal;
        alias /var/lib/uebtv/recordings/vod/;
        default_type video/mp4;
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 3600s;
    }

    location ~* \.(?:env|log|sql|bak)$ { deny all; }
    location ~ /\.(?!well-known).* { deny all; }
}
